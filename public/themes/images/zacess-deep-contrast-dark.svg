<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-label="Zacess Deep Contrast Dark code theme preview: TypeScript, Python, Rust, HTML and diff lines in #ffffff on #000000. Keywords are bold, comments and parameters italic and invalid code underlined.">
  <title>Zacess Deep Contrast Dark code theme preview: TypeScript, Python, Rust, HTML and diff lines in #ffffff on #000000. Keywords are bold, comments and parameters italic and invalid code underlined.</title>
  <rect width="720" height="530" fill="#000000"/>
  <rect width="720" height="40" fill="#0a0a0a"/>
  <rect y="40" width="720" height="1" fill="#00ffff"/>
  <g font-family="'Atkinson Hyperlegible Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">
  <text x="20" y="26" fill="#ffffff" font-weight="700">Zacess Deep Contrast Dark</text>
  <text x="40" y="64" fill="#ffffff" text-anchor="end">1</text>
  <text x="56" y="64" xml:space="preserve"><tspan fill="#00c600" font-style="italic">// read the page aloud at the reader's pace</tspan></text>
  <text x="40" y="90" fill="#ffffff" text-anchor="end">2</text>
  <text x="56" y="90" xml:space="preserve"><tspan fill="#67aeff" font-weight="700">export</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#67aeff" font-weight="700">function</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffdf5a">speak</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ffffff" font-style="italic">page</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">Page</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff" font-style="italic">rate</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#e19e00">1.25</tspan><tspan fill="#ffffff">): </tspan><tspan fill="#00ebb1">string</tspan><tspan fill="#ffffff"> {</tspan></text>
  <rect x="0" y="98" width="720" height="26" fill="#262626"/>
  <text x="40" y="116" fill="#ffff00" text-anchor="end">3</text>
  <text x="56" y="116" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#ffabfd" font-weight="700">if</tspan><tspan fill="#ffffff"> (!</tspan><tspan fill="#ffffff">page</tspan><tspan fill="#ffffff">.</tspan><tspan fill="#c195ff">text</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#ffabfd" font-weight="700">return</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffaa7c">&quot;&quot;</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="40" y="142" fill="#ffffff" text-anchor="end">4</text>
  <text x="56" y="142" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#ffabfd" font-weight="700">return</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffffff">page</tspan><tspan fill="#ffffff">.</tspan><tspan fill="#c195ff">text</tspan><tspan fill="#ffffff">.</tspan><tspan fill="#ffdf5a">replace</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ff80c5">/\s+/g</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffaa7c">&quot; &quot;</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="40" y="168" fill="#ffffff" text-anchor="end">5</text>
  <text x="56" y="168" xml:space="preserve"><tspan fill="#ffffff">}</tspan></text>
  <text x="40" y="194" fill="#ffffff" text-anchor="end">6</text>
  <text x="40" y="220" fill="#ffffff" text-anchor="end">7</text>
  <text x="56" y="220" xml:space="preserve"><tspan fill="#67aeff" font-weight="700">def</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffdf5a">ratio</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ffffff" font-style="italic">hi</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">float</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ffffff" font-style="italic">lo</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">float</tspan><tspan fill="#ffffff">) -&gt; </tspan><tspan fill="#00ebb1">float</tspan><tspan fill="#ffffff">:</tspan></text>
  <text x="40" y="246" fill="#ffffff" text-anchor="end">8</text>
  <text x="56" y="246" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#ffaa7c">&quot;&quot;&quot;Return the WCAG contrast ratio.&quot;&quot;&quot;</tspan></text>
  <text x="40" y="272" fill="#ffffff" text-anchor="end">9</text>
  <text x="56" y="272" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#ffabfd" font-weight="700">return</tspan><tspan fill="#ffffff"> (</tspan><tspan fill="#ffffff">hi</tspan><tspan fill="#ffffff"> + </tspan><tspan fill="#e19e00">0.05</tspan><tspan fill="#ffffff">) / (</tspan><tspan fill="#ffffff">lo</tspan><tspan fill="#ffffff"> + </tspan><tspan fill="#e19e00">0.05</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="40" y="298" fill="#ffffff" text-anchor="end">10</text>
  <text x="40" y="324" fill="#ffffff" text-anchor="end">11</text>
  <text x="56" y="324" xml:space="preserve"><tspan fill="#67aeff" font-weight="700">pub struct</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00ebb1">Profile</tspan><tspan fill="#ffffff"> { </tspan><tspan fill="#c195ff">name</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">String</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#c195ff">size</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">u8</tspan><tspan fill="#ffffff"> }</tspan></text>
  <text x="40" y="350" fill="#ffffff" text-anchor="end">12</text>
  <text x="56" y="350" xml:space="preserve"><tspan fill="#67aeff" font-weight="700">let</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffffff">floor</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#00ebb1">f64</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#e19e00">7.0</tspan><tspan fill="#ffffff">; </tspan><tspan fill="#00c600" font-style="italic">// WCAG AAA</tspan></text>
  <text x="40" y="376" fill="#ffffff" text-anchor="end">13</text>
  <text x="40" y="402" fill="#ffffff" text-anchor="end">14</text>
  <text x="56" y="402" xml:space="preserve"><tspan fill="#ffffff">&lt;</tspan><tspan fill="#67aeff" font-weight="700">a</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#c195ff">href</tspan><tspan fill="#ffffff">=</tspan><tspan fill="#ffaa7c">&quot;/themes/&quot;</tspan><tspan fill="#ffffff">&gt;Code themes&lt;/</tspan><tspan fill="#67aeff" font-weight="700">a</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="40" y="428" fill="#ffffff" text-anchor="end">15</text>
  <text x="56" y="428" xml:space="preserve"><tspan fill="#00f000">+ comments keep 7:1 contrast</tspan></text>
  <text x="40" y="454" fill="#ffffff" text-anchor="end">16</text>
  <text x="56" y="454" xml:space="preserve"><tspan fill="#ffaa7c">- comments faded to grey</tspan></text>
  <text x="40" y="480" fill="#ffffff" text-anchor="end">17</text>
  <text x="56" y="480" xml:space="preserve"><tspan fill="#fd8b78" text-decoration="underline">let 7up = 1;</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00c600" font-style="italic">// invalid: underlined</tspan></text>
  </g>
</svg>
